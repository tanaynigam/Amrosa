<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Chef's Journal — FOREGROUND layer (Android adaptive icon)
       432x432 = 4x the 108dp adaptive grid.
       Visible mask area: centered 288. Safe zone: centered 264 circle (r=132).
       All content sits inside the safe zone.
       Mark: a "C" journal (with page lines) + a "J" bookmark ribbon ending in a spoon bowl. -->
  <g transform="translate(20,11)" fill="none" stroke="#FDF6EC"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- C — the journal cover/spine (arc from -62deg round the left to +95deg) -->
    <path d="M 229.6 134.4 A 80 80 0 1 0 185 284.7" stroke-width="42"/>

    <!-- Page / writing lines inside the journal (delete these two for a cleaner mark) -->
    <path d="M 148 180 H 212" stroke-width="16"/>
    <path d="M 148 212 H 196" stroke-width="16"/>

    <!-- J — the bookmark ribbon: top bar tucks into the journal, stem down, hook left -->
    <path d="M 232 136 L 288 136 L 288 230 C 288 260 272 274 254 277" stroke-width="26"/>

    <!-- Spoon bowl — the J's terminal -->
    <ellipse cx="248" cy="281" rx="29" ry="24" fill="#FDF6EC" stroke="none"
             transform="rotate(-18 248 281)"/>
  </g>
</svg>
