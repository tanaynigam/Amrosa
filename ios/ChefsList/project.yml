name: ChefsList
options:
  bundleIdPrefix: com.aerion
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0

targets:
  ChefsList:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChefsList
    resources:
      - path: ChefsList/GoogleService-Info.plist
    info:
      path: ChefsList/Info.plist
      properties:
        CFBundleDisplayName: Chef's List
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundleIconName: AppIcon
        UIBackgroundModes:
          - remote-notification
        FirebaseAppDelegateProxyEnabled: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          # ⚠️ Rebrand: replace this reversed client id with the one from the NEW
          # chef-s-list GoogleService-Info.plist (REVERSED_CLIENT_ID) when it's swapped in.
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.783138326619-g1jvibdncmgs9f23agt46bngmlov1l6r"
            CFBundleURLName: com.google.reverseClientId
          - CFBundleURLSchemes:
              - "chefslist"
            CFBundleURLName: com.aerion.chefslist.deeplink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerion.chefslist
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "7S2FY6WF5V"
        CODE_SIGN_ENTITLEMENTS: ChefsList/ChefsList.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Kingfisher

  ChefsListTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChefsListTests
    dependencies:
      - target: ChefsList
    settings:
      base:
        SWIFT_VERSION: "5.0"
