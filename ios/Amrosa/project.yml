name: Amrosa
options:
  bundleIdPrefix: com.aerion
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0

targets:
  Amrosa:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Amrosa
    resources:
      - path: Amrosa/GoogleService-Info.plist
    info:
      path: Amrosa/Info.plist
      properties:
        CFBundleDisplayName: Amrosa
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.783138326619-g1jvibdncmgs9f23agt46bngmlov1l6r"
            CFBundleURLName: com.google.reverseClientId
          - CFBundleURLSchemes:
              - "amrosa"
            CFBundleURLName: com.aerion.amrosa.deeplink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerion.amrosa
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Kingfisher

  AmrosaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AmrosaTests
    dependencies:
      - target: Amrosa
    settings:
      base:
        SWIFT_VERSION: "5.0"
