<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChefsList — Amrita &amp; Ambrosia</title>
  <style>
    :root {
      --bg: #1a1612;
      --surface: #241e18;
      --border: #3a2e24;
      --primary: #c97d4a;
      --text: #f0e8df;
      --muted: #9c8878;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .logo { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; color: var(--primary); margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 16px; color: var(--muted); max-width: 360px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="logo">Chef's List</div>
  <h1>Amrita &amp; Ambrosia</h1>
  <p>Recipes that are exquisite, elaborate, and deeply personal.</p>
</body>
</html>
